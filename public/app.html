<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Flow — Business Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><polyline points='6 21 13 13 17 17 26 8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='26 13 26 8 21 8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/jspdf.umd.min.js"></script>
<script src="/vendor/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --accent:#2a78d6;--accent-strong:#256abf;--accent-tint:#eaf2fd;--accent-tint-2:#f4f8fe;
  --page:#f7f8fa;--surface:#ffffff;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;
  --line:rgba(11,11,11,0.08);--line-2:rgba(11,11,11,0.06);
  --pos:#0ca30c;--pos-text:#067a06;--neg:#d03b3b;--neg-text:#c42f2f;--warn:#c98500;--warn-bg:#fff4e0;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
  --shadow-lg:0 10px 40px rgba(16,24,40,.14);--radius:16px;--radius-sm:11px;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9dade;border-radius:20px;border:3px solid transparent;background-clip:content-box}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%,#eaf2fd 0%,transparent 55%),radial-gradient(1000px 500px at 100% 110%,#f0e9fb 0%,transparent 50%),var(--page)}
.login-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:36px 34px}
.lang-toggle{position:absolute;top:20px;right:20px;display:inline-flex;background:#eef0f3;border-radius:9px;padding:3px;gap:2px}
.lang-mini{display:inline-flex;background:#eef0f3;border-radius:9px;padding:3px;gap:2px;margin-left:6px}
.lang-toggle button,.lang-mini button{border:none;background:none;padding:5px 10px;border-radius:7px;font-weight:700;font-size:11px;color:var(--muted);cursor:pointer}
.lang-toggle button.on,.lang-mini button.on{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow-sm)}
.login-card .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#5598e7);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(42,120,214,.34);margin-bottom:18px}
.login-card .logo svg{width:28px;height:28px}
.login-card h1{font-size:22px;font-weight:700;letter-spacing:-.5px;margin:0}
.login-card .sub{color:var(--muted);font-size:13px;margin:4px 0 24px}
.login-card .fg{margin-bottom:14px}
.login-card label{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px}
.login-card input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 14px;outline:none;transition:.13s}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.login-err{background:#fdeef0;color:var(--neg-text);font-size:12.5px;font-weight:500;padding:9px 12px;border-radius:10px;margin-bottom:14px;display:none}
.login-err.show{display:block}
.demo-accts{margin-top:20px;border-top:1px solid var(--line-2);padding-top:16px}
.demo-accts .t{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.demo-chip{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:7px;transition:.12s}
.demo-chip:hover{background:var(--accent-tint-2);border-color:#bcd6f5}
.demo-chip .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.demo-chip .info{flex:1;min-width:0}
.demo-chip .nm{font-size:12.5px;font-weight:600}
.demo-chip .rl{font-size:11px;color:var(--muted)}

/* ---------- App layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#5598e7);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(42,120,214,.32);overflow:hidden}
.brand .logo svg{width:21px;height:21px}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand .name{font-weight:700;font-size:15px;letter-spacing:-.2px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:13.5px;border:none;background:none;width:100%;text-align:left;transition:background .13s,color .13s}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.9}
.nav-item:hover{background:var(--accent-tint-2);color:var(--ink)}
.nav-item.active{background:var(--accent-tint);color:var(--accent-strong);font-weight:600}
.nav-item.active svg{opacity:1}

.usercard{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fcfcfd}
.usercard .av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0;overflow:hidden}
.usercard .av img{width:100%;height:100%;object-fit:cover}
.usercard .info{flex:1;min-width:0}
.usercard .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usercard .rl{font-size:11px;color:var(--muted)}
.usercard .out{width:30px;height:30px;border-radius:8px;border:none;background:#f1f2f5;color:var(--ink-2);display:grid;place-items:center}
.usercard .out:hover{background:#fdeef0;color:var(--neg-text)}
.usercard .out svg{width:15px;height:15px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:0 28px}
.topbar h1{font-size:17px;font-weight:650;letter-spacing:-.3px;margin:0}
.co-switch{display:flex;align-items:center;gap:8px;margin-left:6px}
.co-switch select{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 30px 0 12px;background:var(--surface);-webkit-appearance:none;appearance:none;cursor:pointer;font-weight:600;font-size:13px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23898781' stroke-width='2' stroke-linecap='round'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 9px center}
.role-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase}
.role-admin{background:#efe9fb;color:#5b3aa7}.role-manager{background:var(--accent-tint);color:var(--accent-strong)}.role-sales{background:#e9f5ee;color:#0a7d3f}
.balance-chip{margin-left:auto;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm)}
.balance-chip .dot{width:8px;height:8px;border-radius:50%}
.balance-chip .lbl{font-size:11px;color:var(--muted);font-weight:500}
.balance-chip .val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.pos{color:var(--pos-text)}.neg{color:var(--neg-text)}.dot.pos{background:var(--pos)}.dot.neg{background:var(--neg)}

.content{padding:28px;max-width:1240px;width:100%;margin:0 auto}
.view{display:none;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:18px 19px}
.kpi .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent-strong)}
.kpi .ic svg{width:18px;height:18px}
.kpi .ic.g{background:#e6f6e6;color:var(--pos-text)}.kpi .ic.r{background:#fdeaea;color:var(--neg-text)}.kpi .ic.o{background:#fdeee6;color:#c85a26}.kpi .ic.p{background:#efe9fb;color:#5b3aa7}
.kpi .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .val{font-size:23px;font-weight:700;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:5px}
.trend-up{color:var(--pos-text);font-weight:600}.trend-down{color:var(--neg-text);font-weight:600}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:15.5px;font-weight:650;letter-spacing:-.2px;margin:0}
.section-head .desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.charts-row{grid-template-columns:1fr 1fr}
@media(max-width:920px){.charts-row{grid-template-columns:1fr}}
.chart-card{padding:20px}
.chart-card h3{font-size:14px;font-weight:600;margin:0}
.chart-card .ch-sub{font-size:11.5px;color:var(--muted)}
.chart-wrap{position:relative;height:236px;margin-top:10px}
.chart-wrap.sm{height:210px}
.charts-row3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.charts-row3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.charts-row3{grid-template-columns:minmax(0,1fr)}}
.chart-wrap.md{height:270px}
.chart-total{font-size:18px;font-weight:700;letter-spacing:-.3px;margin-top:4px;font-variant-numeric:tabular-nums}
.remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin:2px 0 16px;cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.pay-form{display:grid;grid-template-columns:150px 1fr 1.4fr auto;gap:10px;align-items:end;margin-top:10px}
@media(max-width:640px){.pay-form{grid-template-columns:1fr 1fr}}
.days-badge{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:600;background:#f1f2f5;color:var(--ink-2)}
.days-badge.warm{background:var(--warn-bg);color:var(--warn)}.days-badge.hot{background:#fdeef0;color:var(--neg-text)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);transition:.13s}
.btn:hover{background:#fafbfc;border-color:rgba(11,11,11,.14)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(42,120,214,.28)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--accent-tint-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger:hover{color:var(--neg-text);border-color:#f0c4c4;background:#fdf3f3}
.btn:disabled{opacity:.5;cursor:not-allowed}

.flow-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.flow-actions{display:flex;gap:10px}
.tabs{display:inline-flex;gap:3px;background:#eef0f3;padding:4px;border-radius:12px}
.tab{padding:8px 16px;border-radius:9px;border:none;background:none;font-weight:600;font-size:13px;color:var(--ink-2);transition:.13s}
.tab.active{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow-sm)}

.table-card{padding:0;overflow:hidden}
.table-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.table-tools .spacer{flex:1}
.field{position:relative;display:flex;align-items:center}
.field svg{position:absolute;left:11px;width:15px;height:15px;color:var(--muted);pointer-events:none}
.input,select.input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--ink);outline:none;transition:.13s;min-width:0}
.input.search{padding-left:33px;width:210px}
.input:focus,select.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
select.input{padding-right:30px;-webkit-appearance:none;appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23898781' stroke-width='2' stroke-linecap='round'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 9px center}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:11px 18px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fcfcfd}
tbody td{padding:13px 18px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-tint-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty svg{width:38px;height:38px;opacity:.4;margin-bottom:10px}
.empty .big{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.rev{background:#e9f5ee;color:#0a7d3f}.pill.exp{background:#fdeef0;color:#c42f4a}
.pill.avail{background:#e9f5ee;color:#0a7d3f}.pill.reserved{background:var(--warn-bg);color:var(--warn)}.pill.sold{background:#eef0f3;color:#5b6472}
.pill.cash{background:#e9f5ee;color:#0a7d3f}.pill.credit{background:var(--warn-bg);color:var(--warn)}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:500;background:#f1f2f5;color:var(--ink-2)}
.muted{color:var(--muted)}.mono{font-variant-numeric:tabular-nums}

.activity{padding:8px 6px}
.act-row{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:11px;transition:.12s}
.act-row:hover{background:var(--accent-tint-2)}
.act-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.act-ic svg{width:17px;height:17px}
.act-ic.rev{background:#e6f6e6;color:var(--pos-text)}.act-ic.exp{background:#fdeaea;color:var(--neg-text)}.act-ic.inv{background:var(--accent-tint);color:var(--accent-strong)}
.act-main{flex:1;min-width:0}
.act-title{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-sub{font-size:11.5px;color:var(--muted)}
.act-amt{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.avatar{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.row-flex{display:flex;align-items:center;gap:10px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(16,20,28,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex;animation:fade .18s ease}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:500px;max-height:92vh;overflow-y:auto;animation:pop .22s cubic-bezier(.16,1,.3,1)}
.modal.wide{max-width:620px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:22px 24px 6px;display:flex;align-items:flex-start;justify-content:space-between}
.modal-head h3{font-size:17px;font-weight:650;margin:0;letter-spacing:-.3px}
.modal-head p{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.x{width:32px;height:32px;border-radius:9px;border:none;background:#f1f2f5;color:var(--ink-2);display:grid;place-items:center;flex-shrink:0}
.x:hover{background:#e6e8ec}.x svg{width:16px;height:16px}
.modal-body{padding:16px 24px 8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-size:12px;font-weight:600;color:var(--ink-2)}
.fg .req{color:var(--neg)}
.fg input,.fg select,.fg textarea{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--ink);outline:none;transition:.13s;width:100%}
.fg textarea{height:auto;padding:10px 12px;resize:vertical;min-height:60px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.fg select{-webkit-appearance:none;appearance:none;cursor:pointer;padding-right:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23898781' stroke-width='2' stroke-linecap='round'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
.hint{font-size:11px;color:var(--muted)}
.derived{background:var(--accent-tint-2);border:1px dashed #bcd6f5;border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--accent-strong);display:flex;justify-content:space-between;align-items:center}
.derived b{font-variant-numeric:tabular-nums}
.modal-foot{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line-2);margin-top:14px}
.err{border-color:var(--neg)!important;box-shadow:0 0 0 3px #fdeaea!important}
.seg{display:inline-flex;background:#eef0f3;border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow-sm)}
.uploader{display:flex;align-items:center;gap:14px}
.uploader .prev{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden;flex-shrink:0}
.uploader .prev img{width:100%;height:100%;object-fit:cover}

let _re=null;
function trText(t){
  if(!t||!t.trim()) return t;
  if(!_re){ const keys=Object.keys(ES).filter(k=>k!==ES[k]).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); _re=new RegExp(keys.join('|'),'g'); }
  return t.replace(_re,m=>ES[m]||m);  // single pass — no cascading re-translation
}
function trEl(id){ const e=document.getElementById(id); if(e) e.innerHTML=tr(e.innerHTML); }
// Translate only visible TEXT (between tags) + placeholder/title attrs — never ids/classes/handlers.
function tr(html){
  if(lang!=='es'||html==null) return html;
  let s=String(html);
  if(s.indexOf('<')<0) return trText(s);            // plain text (toasts, titles)
  s=s.replace(/>([^<]+)</g,(m,t)=>'>'+trText(t)+'<');
  s=s.replace(/(placeholder|title)="([^"]*)"/g,(m,a,v)=>a+'="'+trText(v)+'"');
  return s;
}

/* ---------- server API layer ---------- */
async function apiReq(method,path,body){
  const opt={method,headers:{}};
  if(body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const res=await fetch(path,opt);
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((data&&data.error)||('HTTP '+res.status)); err.status=res.status; throw err; }
  return data;
}
function apiErr(e){ return (e&&e.message)||'Error'; }
async function loadState(companyId){
  const q=companyId?('?companyId='+encodeURIComponent(companyId)):'';
  const st=await apiReq('GET','/api/state'+q);
  session.user=st.me;
  DB.companies=st.companies||[]; DB.users=st.users||[]; DB.inventory=st.inventory||[];
  DB.clients=st.clients||[]; DB.sales=st.sales||[]; DB.expenses=st.expenses||[]; DB.revenues=st.revenues||[]; DB.payments=st.payments||[];
  adminCompanyId=st.activeCompanyId||null;
  return st;
}
async function reload(){ try{ await loadState(adminCompanyId); }catch(e){ if(e.status===401){ return logout(); } } refreshBalance(); go(currentView); }

const fmtShort=n=>{const a=Math.abs(n);if(a>=1e9)return '₲'+(n/1e9).toFixed(1).replace(/\.0$/,'')+'B';if(a>=1e6)return '₲'+(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(a>=1e3)return '₲'+(n/1e3).toFixed(0)+'k';return '₲'+Math.round(n);};
const parseNum=s=>{const n=parseFloat(String(s).replace(/[^\d.]/g,''));return isNaN(n)?0:n;};
const parseInt2=s=>{const n=parseFloat(String(s).replace(/[^\d]/g,''));return isNaN(n)?0:n;};
const ymKey=d=>d.slice(0,7);
const monthLabel=ym=>{const[y,m]=ym.split('-');return mName(+m-1)+' '+y;};
const localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>localISO(new Date());
const fmtDate=d=>{const[y,m,day]=d.split('-');return `${day} ${mName(+m-1)} ${y}`;};
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const avColor=seed=>AV_COLORS[[...String(seed)].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];

/* ---------- scope by active company ---------- */
function activeCompanyId(){ return session.user.role==='admin'? adminCompanyId : session.user.companyId; }
function activeCompany(){ return DB.companies.find(c=>c.id===activeCompanyId()); }
const coScope=list=>list.filter(x=>x.companyId===activeCompanyId());
function myScope(list){ // sales see only their own; managers/admin see all in company
  const l=coScope(list);
  return session.user.role==='sales'? l.filter(x=>x.agentId===session.user.id) : l;
}
/* permissions */
function can(what){ const r=session.user.role;
  switch(what){
    case 'expenses': case 'inventoryManage': case 'profitCharts': case 'reports': case 'allClients': case 'team': case 'logo':
      return r==='admin'||r==='manager';
    case 'createSales': return r==='admin'||r==='manager';   // create sales-agent profiles
    case 'createManagers': return r==='admin';               // only admin creates managers/admins & companies
    case 'adminConsole': return r==='admin';
    case 'sales': case 'revenue': case 'clients': return true; // everyone
    default: return false;
  }
}

/* ---------- product label (generic beyond watches) ---------- */
function pLabel(){ return (activeCompany()&&activeCompany().productType)||'Item'; }
function plural(w){ if(lang==='es'){ return /[aeiouáéíóú]$/i.test(w)? w+'s' : w+'es'; } return /(?:ch|sh|s|x|z)$/i.test(w)?w+'es' : /[^aeiou]y$/i.test(w)?w.slice(0,-1)+'ies' : w+'s'; }
function pPlural(){ return plural(pLabel()); }

function fillLogin(u,p){ document.getElementById('li_user').value=u; document.getElementById('li_pass').value=p; document.getElementById('loginErr').classList.remove('show'); }
async function doLogin(){
  const u=document.getElementById('li_user').value.trim(), p=document.getElementById('li_pass').value;
  document.getElementById('loginErr').classList.remove('show');
  try{
    await apiReq('POST','/api/auth/login',{username:u,password:p});
    await saveBrowserCredential(u,p);
    await loadState();
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    bootApp();
  }catch(e){ document.getElementById('loginErr').classList.add('show'); }
}
// Explicitly offer to save the password in the browser's password manager (Chrome/Edge/Android).
// Safari/Firefox rely on the <form> autocomplete attributes and show their own prompt.
async function saveBrowserCredential(u,p){
  try{
    if(!document.getElementById('li_remember').checked) return;
    if(window.PasswordCredential && navigator.credentials && navigator.credentials.store){
      await navigator.credentials.store(new PasswordCredential({id:u,password:p,name:u}));
    }
  }catch(e){}
}
async function logout(){ try{ await apiReq('POST','/api/auth/logout'); }catch(e){}
  try{ if(navigator.credentials&&navigator.credentials.preventSilentAccess) await navigator.credentials.preventSilentAccess(); }catch(e){}
  session.user=null; document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden');
  document.getElementById('li_user').value=''; document.getElementById('li_pass').value=''; document.getElementById('loginErr').classList.remove('show'); }

/* ============================================================
   AGGREGATES (scoped to active company)
   ============================================================ */
const revList=()=>coScope(DB.revenues);
const expList=()=>coScope(DB.expenses);
const saleList=()=>coScope(DB.sales);
const invList=()=>coScope(DB.inventory);
const totalRevenue=()=>revList().reduce((a,r)=>a+r.amount,0);
const totalExpenses=()=>expList().reduce((a,e)=>a+e.amount,0);
const balance=()=>totalRevenue()-totalExpenses();
function monthAgg(ym){
  const rev=revList().filter(r=>ymKey(r.date)===ym), exp=expList().filter(e=>ymKey(e.date)===ym), sal=saleList().filter(s=>ymKey(s.date)===ym);
  const revSum=rev.reduce((a,r)=>a+r.amount,0), expSum=exp.reduce((a,e)=>a+e.amount,0);
  return {rev,exp,sal,revSum,expSum,profit:revSum-expSum,sold:sal.length,avgSale:sal.length?sal.reduce((a,s)=>a+s.price,0)/sal.length:0};
}
function dataMonths(){ // months from first transaction to now (empty if no data)
  const dates=[...revList(),...expList()].map(x=>x.date).sort();
  if(!dates.length) return [];
  const first=new Date(dates[0].slice(0,7)+'-01'), now=new Date(); const arr=[];
  let d=new Date(now.getFullYear(),now.getMonth(),1);
  while(d>=first){ arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); d=new Date(d.getFullYear(),d.getMonth()-1,1); }
  return arr; // newest first
}
function lastNMonths(n){ const now=new Date(),arr=[]; for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);} return arr; }
function clientCreditSold(cid){ return coScope(DB.sales).filter(s=>s.clientId===cid&&s.payment==='Credit').reduce((a,s)=>a+s.price,0); }
function clientPayments(cid){ return coScope(DB.payments).filter(p=>p.clientId===cid); }
function clientPaid(cid){ return clientPayments(cid).reduce((a,p)=>a+p.amount,0); }
function clientBalance(cid){ // outstanding credit = credit sales − payments received
  return Math.max(0,clientCreditSold(cid)-clientPaid(cid));
}
function clientTotal(cid){ return coScope(DB.sales).filter(s=>s.clientId===cid).reduce((a,s)=>a+s.price,0); }

  const sel=months[0];

function renderDashBody(){
  const ym=document.getElementById('dashMonth').value; const a=monthAgg(ym);

  const showProfit=can('profitCharts');
  const brandRev={}; revList().filter(r=>r.saleId).forEach(r=>brandRev[r.brand]=(brandRev[r.brand]||0)+r.amount);
  const bestBrand=Object.entries(brandRev).sort((x,y)=>y[1]-x[1])[0];
  const brandRevMonth={}; a.rev.filter(r=>r.saleId).forEach(r=>brandRevMonth[r.brand]=(brandRevMonth[r.brand]||0)+r.amount);
  const brandRevMonthE=Object.entries(brandRevMonth).sort((x,y)=>y[1]-x[1]);
  const margin=a.revSum?(a.profit/a.revSum*100):0;
  const invAvail=invList().filter(i=>i.status==='Available').length;
  const months=dataMonths(); const idx=months.indexOf(ym); const prev=idx>=0&&idx<months.length-1?monthAgg(months[idx+1]):null;
  const delta=(cur,prv)=>{ if(!prv||prv===0)return ''; const d=((cur-prv)/Math.abs(prv))*100,up=d>=0; return `<span class="${up?'trend-up':'trend-down'}">${up?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</span> vs prev`; };

  kpis.push({ic:'up',cls:'g',lbl:'Monthly Revenue',val:fmt(a.revSum),sub:prev?delta(a.revSum,prev.revSum):'&nbsp;'});
  if(showProfit){ kpis.push({ic:'down',cls:'r',lbl:'Monthly Expenses',val:fmt(a.expSum),sub:prev?delta(a.expSum,prev.expSum):'&nbsp;'});
    kpis.push({ic:'chart',cls:a.profit>=0?'g':'r',lbl:'Monthly Profit',val:fmt(a.profit),sub:prev?delta(a.profit,prev.profit):'&nbsp;'}); }
  kpis.push({ic:'box',cls:'',lbl:pPlural()+' Sold (mo.)',val:a.sold,sub:'this period'});
  kpis.push({ic:'tag',cls:'o',lbl:'Avg Sale Value',val:fmt(a.avgSale),sub:'per '+pLabel().toLowerCase()});

      <div class="card chart-card"><h3>Monthly Profit</h3><div class="ch-sub">Net profit trend · PYG</div><div class="chart-wrap"><canvas id="chProfit"></canvas></div></div></div>
      <div class="grid charts-row3" style="margin-top:18px">
      <div class="card chart-card"><h3>Sales by Brand (month)</h3><div class="ch-sub">Revenue share · ${monthLabel(ym)}</div><div class="chart-wrap md">${brandRevMonthE.length?'<canvas id="chBrandMonth"></canvas>':'<div class="empty">No sales this month</div>'}</div></div>
      <div class="card chart-card"><h3>Sales by Brand (all time)</h3><div class="ch-sub">All-time revenue share</div><div class="chart-wrap md"><canvas id="chBrand"></canvas></div></div>
      <div class="card chart-card"><h3>Delivery Methods</h3><div class="ch-sub">How ${pPlural().toLowerCase()} reach buyers</div><div class="chart-wrap md"><canvas id="chDelivery"></canvas></div></div></div>`;
  }else{
    // sales: revenue trend only, plus their own quick stats
    html+=`<div class="card chart-card"><h3>My Revenue Trend</h3><div class="ch-sub">Last 6 months · PYG</div><div class="chart-wrap"><canvas id="chRevOnly"></canvas></div></div>`;

  html+=`<div class="section-head"><div><h2>Recent activity</h2></div><button class="btn ghost sm" onclick="go('flow')">View all →</button></div><div id="recentGrid" class="grid" style="grid-template-columns:${showProfit?'1fr 1fr':'1fr'};gap:18px"></div>`;

/* Inventory is shown as a month-end snapshot: a piece counts as "in stock" at a date when it
   was purchased on/before that date and was not yet sold (sale date after it, or unsold). */
function monthEnd(ym){ const [y,m]=ym.split('-').map(Number); return localISO(new Date(y,m,0)); }
function invSoldDate(i){ const s=coScope(DB.sales).filter(x=>x.inventoryId===i.id).map(x=>x.date).sort()[0]; return s||null; }
function invCutoff(ym){ const end=monthEnd(ym), t=today(); return end<t?end:t; }
function invStockAt(date){
  return invList().filter(i=>{
    if(!i.purchaseDate||i.purchaseDate>date) return false;
    const sd=invSoldDate(i);
    if(sd) return sd>date;
    return i.status!=='Sold'; // marked sold without a sale record → not in stock
  });
}
function daysBetween(a,b){ const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number); return Math.max(0,Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)); }
function invMonths(){
  const dates=invList().map(i=>i.purchaseDate).filter(Boolean).sort(); const now=new Date(), arr=[];
  let d=new Date(now.getFullYear(),now.getMonth(),1);
  const first=dates.length?new Date(+dates[0].slice(0,4),+dates[0].slice(5,7)-1,1):d;
  while(d>=first){ arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); d=new Date(d.getFullYear(),d.getMonth()-1,1); }
  return arr; // newest first
}
function unitWord(n,w){ const W={piece:['piece','pieces','pieza','piezas'],day:['day','days','día','días']}[w]; return W[(lang==='es'?2:0)+(n===1?0:1)]; }
// status shown as it was on the snapshot date (a piece sold later was still available then)
function invStatusAt(i){ return invSoldDate(i)||i.status==='Sold' ? 'Available' : i.status; }
function isCurrentMonth(ym){ return ym===today().slice(0,7); }
function viewInventory(){
  const c=activeCompany(); if(!c) return emptyState('No company selected','Pick or create a company first.','shield');
  const months=invMonths();
  return `<div class="section-head" style="margin-top:2px"><div><h2>${pLabel()} inventory</h2><div class="desc" id="invDesc">Manage stock, purchase cost and status</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><select class="input" id="invMonth" style="height:38px" onchange="POST.inventory()">${months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}</select>
    <button class="btn" onclick="exportInventory()">${download()}Export</button><button class="btn primary" onclick="openInv()">${plus()}Add ${pLabel()}</button></div></div>
  <div class="grid charts-row3" id="invCharts"></div>
  <div class="card table-card" style="margin-top:18px">
    <div class="table-tools"><b style="font-size:13.5px" id="invTblTitle"></b><div class="field">${searchIcon()}<input class="input search" id="invSearch" placeholder="Search model, SKU, brand…" oninput="renderInv()"></div>
      <select class="input" id="invStatus" onchange="renderInv()"><option value="">All status</option><option value="Available">Available</option><option value="Reserved">Reserved</option></select><div class="spacer"></div></div>
    <div class="tbl-scroll"><table><thead><tr><th>Brand</th><th>Model</th><th>SKU</th><th class="num">Cost (USD)</th><th class="num">Cost (PYG)</th><th class="num">Sell (PYG)</th><th>Status</th><th>Purchased</th><th class="num">Days in stock</th><th></th></tr></thead><tbody id="invBody"></tbody></table></div>
  </div>`;
}
POST.inventory=()=>{
  const ym=val('invMonth')||today().slice(0,7);
  const cur=isCurrentMonth(ym);
  document.getElementById('invDesc').textContent=tr(cur?'Available pieces as of today':'Available pieces at month end')+' · '+(cur?fmtDate(today()):fmtDate(monthEnd(ym)));

function brandAgg(items){
  const m={}; items.forEach(i=>{ const b=i.brand||'—'; if(!m[b])m[b]={qty:0,cost:0,sell:0}; m[b].qty++; m[b].cost+=(+i.purchasePYG||0); m[b].sell+=(+i.sellPrice||0); });
  return m;
}
function renderInvCharts(){
  const ym=val('invMonth')||today().slice(0,7);
  const stock=invStockAt(invCutoff(ym)); const agg=brandAgg(stock);
  const tQ=stock.length, tC=stock.reduce((a,i)=>a+(+i.purchasePYG||0),0), tS=stock.reduce((a,i)=>a+(+i.sellPrice||0),0);
  const card=(id,title,total)=>`<div class="card chart-card"><h3>${title}</h3><div class="chart-total">${total}</div><div class="chart-wrap md">${tQ?`<canvas id="${id}"></canvas>`:'<div class="empty">No stock at this date</div>'}</div></div>`;
  document.getElementById('invCharts').innerHTML=tr(
    card('chInvQty','Stock by Brand',`${tQ} ${unitWord(tQ,'piece')}`)+
    card('chInvCost','Stock Value at Cost',fmt(tC))+
    card('chInvVal','Stock Value at Sale Price',fmt(tS)));
  if(!tQ) return;
  const order=Object.entries(agg).sort((a,b)=>b[1].sell-a[1].sell).map(x=>x[0]); // same colour per brand in all 3 charts
  const draw=(id,key,money)=>{ const e=Object.entries(agg).map(([b,v])=>[b,v[key]]).sort((a,b)=>b[1]-a[1]);
    mkChart(id,{type:'doughnut',data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:e.map(x=>SERIES[order.indexOf(x[0])%SERIES.length]),borderColor:'#fff',borderWidth:2,hoverOffset:8}]},options:donutOpts(money,true)}); };
  draw('chInvQty','qty',false); draw('chInvCost','cost',true); draw('chInvVal','sell',true);
}
function renderInv(){
  const ym=val('invMonth')||today().slice(0,7); const cut=invCutoff(ym);
  const q=(val('invSearch')||'').toLowerCase(), st=val('invStatus');
  let inv=invStockAt(cut).filter(i=>(!st||invStatusAt(i)===st)&&(!q||`${i.brand} ${i.model} ${i.sku}`.toLowerCase().includes(q))).sort((a,b)=>a.purchaseDate.localeCompare(b.purchaseDate));

async function delInv(id){

function exportInventory(){
  const ym=val('invMonth')||today().slice(0,7); const cur=isCurrentMonth(ym); const cut=invCutoff(ym);
  const inv=invStockAt(cut).sort((a,b)=>a.purchaseDate.localeCompare(b.purchaseDate)); const agg=brandAgg(inv);

  const sum=Object.entries(agg).sort((a,b)=>b[1].sell-a[1].sell).map(([b,v])=>[b,String(v.qty),pct(v.qty,inv.length),fmtPdf(v.cost),pct(v.cost,tC),fmtPdf(v.sell),pct(v.sell,tS)]);

  doc.autoTable({startY:116,head:[[tr('Brand'),tr('Qty'),'%',tr('Cost value'),'%',tr('Sale value'),'%']],body:sum,theme:'grid',headStyles:{fillColor:[42,120,214],fontSize:8.5},bodyStyles:{fontSize:8.5},margin:{left:40,right:40},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}});
  doc.autoTable({startY:doc.lastAutoTable.finalY+22,head:[[tr('Brand'),tr('Model'),'SKU',tr('Cost USD'),tr('Cost PYG'),tr('Sell PYG'),tr('Purchased'),tr('Days in stock')]],

function exportReportPDF(){
  const ym=val('repMonth'); const a=monthAgg(ym); const co=activeCompany();
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'}); const W=doc.internal.pageSize.getWidth();
  doc.setFillColor(42,120,214); doc.rect(0,0,W,86,'F'); doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.text(co.name,40,42);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text(tr('Monthly Financial Report'),40,62);
  doc.setFontSize(10); doc.text(monthLabel(ym),W-40,42,{align:'right'}); doc.setFontSize(9); doc.text(tr('Generated ')+today(),W-40,60,{align:'right'});
  let y=120; const cards=[['Total Revenue',fmtPdf(a.revSum),[27,175,122]],['Total Expenses',fmtPdf(a.expSum),[235,104,52]],['Net Profit',fmtPdf(a.profit),a.profit>=0?[42,120,214]:[208,59,59]]];
  const cw=(W-80-24)/3;
  cards.forEach((c,i)=>{ const x=40+i*(cw+12); doc.setDrawColor(230); doc.setFillColor(252,252,253); doc.roundedRect(x,y,cw,66,8,8,'FD'); doc.setFillColor(...c[2]); doc.rect(x,y,cw,3,'F');
    doc.setTextColor(120); doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(tr(c[0]),x+12,y+24); doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text(c[1],x+12,y+46); });
  y+=92; doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(tr('Revenue by category'),40,y);
  doc.autoTable({startY:y+8,head:[[tr('Category'),tr('Amount'),tr('Share')]],body:catRows(a.rev,a.revSum),theme:'grid',headStyles:{fillColor:[42,120,214],fontSize:9},bodyStyles:{fontSize:9},margin:{left:40,right:40},columnStyles:{1:{halign:'right'},2:{halign:'right'}}});
  y=doc.lastAutoTable.finalY+26; doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(tr('Expenses by category'),40,y);
  doc.autoTable({startY:y+8,head:[[tr('Category'),tr('Amount'),tr('Share')]],body:catRows(a.exp,a.expSum),theme:'grid',headStyles:{fillColor:[235,104,52],fontSize:9},bodyStyles:{fontSize:9},margin:{left:40,right:40},columnStyles:{1:{halign:'right'},2:{halign:'right'}}});
  y=doc.lastAutoTable.finalY+26;
  if(a.sal.length){ doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(tr('Watches sold')+' — '+pPlural()+' ('+a.sal.length+')',40,y);
    doc.autoTable({startY:y+8,head:[[tr('Date'),tr('Brand'),tr('Model'),tr('Client'),tr('Pay'),tr('Price')]],body:a.sal.sort((x,z)=>x.date.localeCompare(z.date)).map(s=>[fmtDate(s.date),s.brand,s.model,clientName(s.clientId),s.payment||'—',fmtPdf(s.price)]),theme:'striped',headStyles:{fillColor:[60,60,60],fontSize:9},bodyStyles:{fontSize:8.5},margin:{left:40,right:40},columnStyles:{5:{halign:'right'}}}); }
  const ph=doc.internal.pageSize.getHeight(); doc.setFontSize(8); doc.setTextColor(150); doc.text(co.name+tr(' · Business Flow — confidential'),40,ph-24);
  doc.save(`report-${co.name.toLowerCase().replace(/\s/g,'-')}-${ym}.pdf`); toast('PDF report downloaded');
}
function catRows(list,total){ const m={}; list.forEach(x=>m[x.category]=(m[x.category]||0)+x.amount); const e=Object.entries(m).sort((x,y)=>y[1]-x[1]);
  if(!e.length)return [['—','Gs. 0','0%']]; const rows=e.map(([c,v])=>[c,fmtPdf(v),(total?(v/total*100).toFixed(1):0)+'%']);
  rows.push([{content:'Total',styles:{fontStyle:'bold'}},{content:fmtPdf(total),styles:{fontStyle:'bold',halign:'right'}},{content:'100%',styles:{fontStyle:'bold',halign:'right'}}]); return rows; }

      <div class="fg"><label>Date <span class="req">*</span></label><input type="date" id="e_date" value="${today()}"></div>
      <div class="fg"><label>Amount (PYG) <span class="req">*</span></label><input id="e_amount" inputmode="numeric" placeholder="250.000"></div>
      <div class="fg full"><label>Category <span class="req">*</span></label><select id="e_cat">${EXP_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="fg full"><label>Description <span class="muted" style="font-weight:400">(optional)</span></label><textarea id="e_desc" placeholder="What was this for?"></textarea></div>
    </div></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveExpense()">Save expense</button></div></div>`);
}
async function saveExpense(){ const amt=parseInt2(val('e_amount')); if(amt<=0){document.getElementById('e_amount').classList.add('err');toast('Enter an amount','warn');return;}
  try{ await apiReq('POST','/api/expenses',{companyId:activeCompanyId(),date:val('e_date'),amount:amt,category:val('e_cat'),description:val('e_desc').trim()}); closeModal(); await reload(); toast('Expense saved'); }catch(e){ toast(apiErr(e),'warn'); } }
function openRevenue(){
  if(!can('expenses')){toast('Not permitted for your role','warn');return;}
  showModalHTML(`<div class="modal"><div class="modal-head"><div><h3>Add revenue</h3><p>Income not tied to a product sale.</p></div><button class="x" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg"><label>Date <span class="req">*</span></label><input type="date" id="r_date" value="${today()}"></div>
      <div class="fg"><label>Amount (PYG) <span class="req">*</span></label><input id="r_amount" inputmode="numeric" placeholder="500.000"></div>
      <div class="fg full"><label>Category <span class="req">*</span></label><select id="r_cat">${REV_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="fg full"><label>Description <span class="muted" style="font-weight:400">(optional)</span></label><textarea id="r_desc" placeholder="Source of this revenue"></textarea></div>
    </div></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRevenue()">Save revenue</button></div></div>`);
}
async function saveRevenue(){ const amt=parseInt2(val('r_amount')); if(amt<=0){document.getElementById('r_amount').classList.add('err');toast('Enter an amount','warn');return;}
  try{ await apiReq('POST','/api/revenues',{companyId:activeCompanyId(),date:val('r_date'),amount:amt,category:val('r_cat'),description:val('r_desc').trim()}); closeModal(); await reload(); toast('Revenue saved'); }catch(e){ toast(apiErr(e),'warn'); } }

function openInv(){
  if(!can('inventoryManage')){toast('Not permitted for your role','warn');return;}
  showModalHTML(`<div class="modal"><div class="modal-head"><div><h3>Add ${pLabel().toLowerCase()} to inventory</h3><p>Purchase cost in USD converts to PYG.</p></div><button class="x" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg"><label>Brand <span class="req">*</span></label><input id="i_brand" placeholder="e.g. Seiko"></div>
      <div class="fg"><label>Model / number <span class="req">*</span></label><input id="i_model" placeholder="e.g. SRPB41"></div>
      <div class="fg"><label>SKU</label><input id="i_sku" placeholder="auto if blank"></div>
      <div class="fg"><label>Purchase date</label><input type="date" id="i_date" value="${today()}"></div>
      <div class="fg"><label>Purchase price (USD) <span class="req">*</span></label><input id="i_usd" inputmode="decimal" oninput="updInvPreview()" placeholder="180"></div>
      <div class="fg"><label>USD/PYG rate <span class="req">*</span></label><input id="i_fx" inputmode="numeric" value="7300" oninput="updInvPreview()"></div>
      <div class="fg full derived"><span>Purchase price in <b>PYG</b> (auto)</span><b id="i_pyg">₲ 0</b></div>
      <div class="fg"><label>Selling price (PYG) <span class="req">*</span></label><input id="i_sell" inputmode="numeric" placeholder="1.500.000"></div>
      <div class="fg"><label>Status</label><select id="i_status"><option value="Available">Available</option><option value="Reserved">Reserved</option><option value="Sold">Sold</option></select></div>
    </div></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveInv()">Add to inventory</button></div></div>`);
}
function updInvPreview(){ const usd=parseNum(val('i_usd')),fx=parseInt2(val('i_fx')); document.getElementById('i_pyg').textContent=fmt(usd*fx); }
async function saveInv(){ const brand=val('i_brand').trim(),model=val('i_model').trim(),usd=parseNum(val('i_usd')),fx=parseInt2(val('i_fx')),sell=parseInt2(val('i_sell'));
  let ok=true; [['i_brand',!!brand],['i_model',!!model],['i_usd',usd>0],['i_fx',fx>0],['i_sell',sell>0]].forEach(([id,v])=>{ if(!v){document.getElementById(id).classList.add('err');ok=false;} });
  if(!ok){toast('Complete the required fields','warn');return;}
  try{ await apiReq('POST','/api/inventory',{companyId:activeCompanyId(),brand,model,sku:val('i_sku').trim(),purchaseUSD:usd,fxRate:fx,sellPrice:sell,status:val('i_status'),purchaseDate:val('i_date')}); closeModal(); await reload(); toast(pLabel()+' added to inventory'); }catch(e){ toast(apiErr(e),'warn'); } }

function openClient(){
  const canAssign=can('allClients'); const agents=coScope(DB.users).filter(u=>u.role==='sales');
  showModalHTML(`<div class="modal"><div class="modal-head"><div><h3>New client</h3><p>Track recurring buyers and credit.</p></div><button class="x" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg full"><label>Full name <span class="req">*</span></label><input id="c_name" placeholder="e.g. Roberto Duarte"></div>
      <div class="fg"><label>Phone</label><input id="c_phone" placeholder="+595 ..."></div>
      <div class="fg"><label>Email</label><input id="c_email" placeholder="name@mail.com"></div>
      ${canAssign?`<div class="fg full"><label>Assigned agent</label><select id="c_agent"><option value="${session.user.id}">${session.user.name} (me)</option>${agents.filter(a=>a.id!==session.user.id).map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>`:''}
    </div></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveClient()">Create client</button></div></div>`);
}
async function saveClient(){ const name=val('c_name').trim(); if(!name){document.getElementById('c_name').classList.add('err');toast('Enter a name','warn');return;}
  const agentId=can('allClients')?(val('c_agent')||session.user.id):session.user.id;
  try{ await apiReq('POST','/api/clients',{companyId:activeCompanyId(),name,phone:val('c_phone').trim(),email:val('c_email').trim(),agentId}); closeModal(); await reload(); toast('Client created'); }catch(e){ toast(apiErr(e),'warn'); } }

function openUser(presetRole){
  const isAdmin=session.user.role==='admin';
  const roles=isAdmin?['admin','manager','sales']:['sales']; // managers can only create sales
  const companies=isAdmin?DB.companies:[activeCompany()];
  showModalHTML(`<div class="modal"><div class="modal-head"><div><h3>New profile</h3><p>${isAdmin?'Create any role and assign a company.':'Add a sales agent to your company.'}</p></div><button class="x" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg full"><label>Full name <span class="req">*</span></label><input id="u_name" placeholder="e.g. Ana López"></div>
      <div class="fg"><label>Username <span class="req">*</span></label><input id="u_user" placeholder="analopez"></div>
      <div class="fg"><label>Password <span class="req">*</span></label><input id="u_pass" placeholder="temporary password"></div>
      <div class="fg"><label>Role <span class="req">*</span></label><select id="u_role" onchange="onRoleChange()">${roles.map(r=>`<option value="${r}" ${r===presetRole?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></div>
      <div class="fg" id="u_company_fg"><label>Company <span class="req">*</span></label><select id="u_company">${companies.map(c=>c?`<option value="${c.id}">${c.name}</option>`:'').join('')}</select></div>
    </div></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser()">Create profile</button></div></div>`);
  onRoleChange();
}
function onRoleChange(){ const role=val('u_role'); const fg=document.getElementById('u_company_fg'); if(!fg)return; fg.style.display=role==='admin'?'none':'flex'; }
async function saveUser(){
  const name=val('u_name').trim(),username=val('u_user').trim(),pass=val('u_pass'),role=val('u_role');
  let ok=true; [['u_name',!!name],['u_user',!!username],['u_pass',!!pass]].forEach(([id,v])=>{if(!v){document.getElementById(id).classList.add('err');ok=false;}});
  if(!ok){toast('Complete the required fields','warn');return;}
  const companyId=role==='admin'?null:(session.user.role==='admin'?val('u_company'):activeCompanyId());
  try{ await apiReq('POST','/api/users',{name,username,password:pass,role,companyId}); closeModal(); await reload(); buildCoSwitch(); toast('Profile created'); }
  catch(e){ if((e.message||'').indexOf('username')>=0){document.getElementById('u_user').classList.add('err');} toast(apiErr(e),'warn'); } }

function openCompany(){
  showModalHTML(`<div class="modal"><div class="modal-head"><div><h3>New company</h3><p>Starts empty with its own isolated database.</p></div><button class="x" onclick="closeModal()">${xIcon()}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg full"><label>Company name <span class="req">*</span></label><input id="co_name" placeholder="e.g. Acme Electronics"></div>
      <div class="fg full"><label>Product type (what they sell) <span class="req">*</span></label><input id="co_ptype" placeholder="e.g. Watch, Phone, Shoe" value="Item"></div>
    </div><div class="hint" style="margin-top:6px">Tip: after creating, add a manager profile so they can sign in.</div></div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCompanyNew()">Create company</button></div></div>`);
}
async function saveCompanyNew(){ const name=val('co_name').trim(),pt=val('co_ptype').trim()||'Item'; if(!name){document.getElementById('co_name').classList.add('err');toast('Enter a name','warn');return;}
  try{ const r=await apiReq('POST','/api/companies',{name,productType:pt}); adminCompanyId=r.company.id; closeModal(); await loadState(adminCompanyId); buildCoSwitch(); refreshBrand(); toast('Company created — now add a manager'); go('admin'); }catch(e){ toast(apiErr(e),'warn'); } }

/* ============================================================
   shared render helpers
   ============================================================ */
function afterMutation(){ reload(); }
function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function emptyState(title,desc,ic,withBtn){ return `<div class="card" style="padding:64px 24px"><div class="empty"><div style="width:60px;height:60px;border-radius:16px;background:var(--accent-tint);color:var(--accent-strong);display:grid;place-items:center;margin:0 auto 16px">${bigIcon(ic)}</div><div class="big" style="font-size:16px">${title}</div><div style="max-width:360px;margin:0 auto 16px">${desc}</div>${withBtn?`<button class="btn primary" style="margin:0 auto" onclick="openSale()">${plus()}Register first sale</button>`:''}</div></div>`; }

/* ---------- charts ---------- */
const charts={};
function mkChart(id,cfg){ if(charts[id])charts[id].destroy(); const el=document.getElementById(id); if(!el)return; charts[id]=new Chart(el,cfg); }
if(window.Chart){ Chart.defaults.font.family="system-ui,-apple-system,'Segoe UI',sans-serif"; Chart.defaults.font.size=11.5; Chart.defaults.color='#898781'; }
const gridClr='#e1e0d9', money2Tick=v=>fmtShort(v);
function barOpts(){return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',align:'end',labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'circle',padding:14,font:{size:11.5}}},tooltip:tt()},scales:{x:{grid:{display:false},border:{display:false}},y:{grid:{color:gridClr},border:{display:false},ticks:{callback:money2Tick},beginAtZero:true}}};}
function lineOpts(){return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:tt()},scales:{x:{grid:{display:false},border:{display:false}},y:{grid:{color:gridClr},border:{display:false},ticks:{callback:money2Tick}}}};}
function donutOpts(money,bottom){return{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:bottom?'bottom':'right',labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'circle',padding:11,font:{size:11.5}}},tooltip:{...tt(),callbacks:{label:c=>{const tot=c.dataset.data.reduce((a,b)=>a+b,0);const pct=tot?(c.parsed/tot*100).toFixed(1):0;return ` ${c.label}: ${money?fmt(c.parsed):c.parsed} (${pct}%)`;}}}}};}
function tt(){return{backgroundColor:'#0b0b0b',padding:11,cornerRadius:9,titleFont:{size:12,weight:'600'},bodyFont:{size:12},boxPadding:5,usePointStyle:true,callbacks:{label:c=>` ${c.dataset.label||c.label}: ${fmt(c.parsed.y!=null?c.parsed.y:c.parsed)}`}};}
function grad(hex){return c=>{const{ctx,chartArea}=c.chart;if(!chartArea)return hex+'22';const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);g.addColorStop(0,hex+'33');g.addColorStop(1,hex+'02');return g;};}

}[n]||''; return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`; }
function bigIcon(n){ return navIcon(n).replace('stroke-width="2"','stroke-width="1.7"').replace(/width="18"/,''); }
const plus=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
const trash=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>`;
const searchIcon=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>`;
const xIcon=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
const download=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

/* ---------- toast ---------- */
let toastT; function toast(msg,kind){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=tr(msg); t.classList.toggle('warn',kind==='warn');
  document.getElementById('toastIcon').innerHTML=kind==='warn'?'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>':'<polyline points="20 6 9 17 4 12"/>';
  t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- init ---------- */
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal();  });
try{ const sv=localStorage.getItem('bf_lang'); if(sv) lang=sv; }catch(e){}
applyI18n();
(async()=>{
  try{ await loadState(); document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); bootApp(); }
  catch(e){ document.getElementById('login').classList.remove('hidden'); }
})();
</script>
