<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Argus Technology Commercial Software</title>
<meta name="application-name" content="Argus Technology Commercial Software">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M8.5 24 16 8l7.5 16' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><circle cx='16' cy='19.5' r='2' fill='white'/></svg>">
<link rel="preload" href="/vendor/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/jspdf.umd.min.js"></script>
<script src="/vendor/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="/app.css?v=20261113">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="lang-toggle" id="loginLang">
      <button data-lang="es" onclick="setLang('es')">ES</button><button data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5 12 4.5l7.5 15"/><circle cx="12" cy="15" r="1.7" fill="currentColor" stroke="none"/></svg></div>
    <h1>Argus Technology</h1>
    <div class="product">Commercial Software</div>
    <div class="sub" id="li_sub">Ingresa a tu espacio de trabajo</div>
    <div class="login-err" id="loginErr">Usuario o contraseña incorrectos.</div>
    <form id="loginForm" method="post" action="/" autocomplete="on" onsubmit="event.preventDefault();doLogin();">
      <div class="fg"><label id="li_lblUser" for="li_user">Usuario</label><input id="li_user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="fg"><label id="li_lblPass" for="li_pass">Contraseña</label><input id="li_pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
      <label class="remember"><input type="checkbox" id="li_remember" checked><span id="li_lblRemember">Guardar contraseña en este navegador</span></label>
      <button type="submit" class="btn primary" id="li_btn" style="width:100%;height:46px;justify-content:center;font-size:14.5px">Iniciar sesión</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" id="brandLogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5 12 4.5l7.5 15"/><circle cx="12" cy="15" r="1.7" fill="currentColor" stroke="none"/></svg></div>
      <div style="min-width:0"><div class="name" id="brandName">Argus Technology</div><div class="sub" id="brandSub">Commercial Software</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="usercard">
        <div class="av" id="ucAv"></div>
        <div class="info"><div class="nm" id="ucName"></div><div class="rl" id="ucRole"></div></div>
        <button class="out" id="ucOut" title="Sign out" aria-label="Sign out" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
      <div class="made-by">Argus Technology Commercial Software</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="viewTitle">Panel</h1>
      <div class="co-switch" id="coSwitch"></div>
      <div class="top-right">
        <div class="lang-mini" id="topLang">
          <button data-lang="es" onclick="setLang('es')">ES</button><button data-lang="en" onclick="setLang('en')">EN</button>
        </div>
        <div class="balance-chip" id="balChip">
          <div><div class="lbl" id="balLabel">Saldo Actual</div><div class="val pos" id="balVal">₲ 0</div></div>
          <span class="dot pos" id="balDot"></span>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="Sections"></nav>
  <div class="sheet-wrap" id="sheetWrap" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
</div>

<div class="overlay" id="overlay"><div id="modalHost"></div></div>
<div class="toast" id="toast" role="status"><svg id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span id="toastMsg"></span></div>

<script src="/js/app-1.js?v=20261113"></script>
<script src="/js/app-2.js?v=20261113"></script>
<script src="/js/app-3.js?v=20261113"></script>
<script src="/js/app-4.js?v=20261113"></script>
<script src="/js/app-5.js?v=20261113"></script>
<script src="/js/app-6.js?v=20261113"></script>
</body>
</html>
